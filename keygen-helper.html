<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kasir Kita — Key Generator</title>
<style>
  :root { --teal:#249D8F; --dark:#17766B; --cream:#FDF0D5; --terra:#E76F51; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,sans-serif; }
  body { background:#FBF6EC; min-height:100vh; display:flex; justify-content:center; padding:20px; }
  .card { width:100%; max-width:420px; }
  h1 { color:var(--teal); font-size:26px; letter-spacing:2px; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; color:#6E6A5E; font-size:12px; margin-bottom:22px; }
  label { display:block; font-size:12px; font-weight:700; color:#6E6A5E; text-transform:uppercase; letter-spacing:.5px; margin:14px 0 6px; }
  input {
    width:100%; padding:16px; font-size:22px; font-weight:800; letter-spacing:3px;
    border:1px solid #EADFC8; border-radius:12px; background:#FFF; text-align:center;
    color:#2A2721; outline:none; text-transform:uppercase;
  }
  input:focus { border-color:var(--teal); background:var(--cream); }
  button {
    width:100%; margin-top:18px; padding:17px; border:none; border-radius:12px;
    background:var(--teal); color:#FFF; font-size:16px; font-weight:800; letter-spacing:1px; cursor:pointer;
  }
  button:active { background:var(--dark); }
  .result {
    display:none; margin-top:20px; background:var(--cream); border:1px solid var(--teal);
    border-radius:12px; padding:20px; text-align:center;
  }
  .result .code { font-size:28px; font-weight:900; color:var(--dark); letter-spacing:3px; user-select:all; }
  .result .hint { font-size:11px; color:#6E6A5E; margin-top:8px; }
  .copy { margin-top:14px; background:var(--teal); font-size:13px; padding:11px; }
  .err { display:none; margin-top:14px; color:var(--terra); font-weight:700; text-align:center; font-size:13px; }
  .hist { margin-top:24px; }
  .hist h3 { font-size:12px; color:#6E6A5E; text-transform:uppercase; margin-bottom:8px; }
  .hist-item { display:flex; justify-content:space-between; gap:10px; background:#FFF; border:1px solid #EADFC8; border-radius:10px; padding:10px 14px; margin-bottom:6px; font-size:13px; }
  .hist-item b { color:var(--dark); user-select:all; white-space:nowrap; }
  .hist-item span { color:#6E6A5E; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .foot { text-align:center; margin-top:30px; font-size:10px; color:#B9B09C; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 KASIR KITA</h1>
  <div class="sub">Key Generator — khusus pemilik toko</div>

  <label>Device ID Customer</label>
  <input id="dev" placeholder="QKQ1-AA11-BB22" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="19">
  <div class="err" id="err"></div>
  <button onclick="gen()">⚡ GENERATE KODE AKTIVASI</button>

  <div class="result" id="res">
    <div style="font-size:11px;color:#6E6A5E;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Kode Aktivasi</div>
    <div class="code" id="code"></div>
    <div class="hint">Kirim kode ini ke customer via WhatsApp</div>
    <button class="copy" onclick="copyCode()">📋 SALIN KODE</button>
  </div>

  <div class="hist" id="histWrap" style="display:none">
    <h3>Riwayat generate terakhir</h3>
    <div id="hist"></div>
  </div>

  <div class="foot">Jangan bagikan halaman ini ke siapa pun.</div>
</div>

<script>
// ====== RAHASIA — samakan dengan src/license/license.ts ======
const SECRET = '5E175D6EBE1E6E0FA1F068A59308898E090239DFFC59E2C4';
const ALPHA = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

async function hmacSha256(keyStr, msgStr) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(keyStr), { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(msgStr));
  return new Uint8Array(sig);
}

function bytesToBase32(bytes) {
  let bits = 0n, val = 0n, out = '';
  for (const b of bytes) {
    val = (val << 8n) | BigInt(b);
    bits += 8n;
    while (bits >= 5n) { out += ALPHA[Number((val >> (bits - 5n)) & 31n)]; bits -= 5n; }
  }
  if (bits > 0n) out += ALPHA[Number((val << (5n - bits)) & 31n)];
  return out.slice(0, 16);
}

function normalize(s) {
  return String(s).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12).padEnd(12, 'X');
}

let lastCode = '';
async function gen() {
  const dev = document.getElementById('dev').value;
  document.getElementById('err').style.display = 'none';
  if (!normalize(dev).replace(/X+$/,'')) {
    const e = document.getElementById('err');
    e.textContent = 'Isi dulu Device ID dari customer';
    e.style.display = 'block';
    return;
  }
  const n = normalize(dev);
  const mac = await hmacSha256(SECRET, n);
  lastCode = (bytesToBase32(mac).match(/.{4}/g) || []).join('-');
  document.getElementById('code').textContent = lastCode;
  document.getElementById('res').style.display = 'block';
  addHistory(n, lastCode);
}

function copyCode() {
  const done = () => {
    const b = document.querySelector('.copy');
    b.textContent = '✅ TERSALIN!';
    setTimeout(() => b.textContent = '📋 SALIN KODE', 1500);
  };
  // Coba Clipboard API dulu; kalau gagal (non-HTTPS / webview), pakai cara lama
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(lastCode).then(done).catch(() => fallbackCopy(done));
  } else {
    fallbackCopy(done);
  }
}

function fallbackCopy(done) {
  const ta = document.createElement('textarea');
  ta.value = lastCode;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { alert('Salin manual:\n' + lastCode); }
  document.body.removeChild(ta);
}

function addHistory(dev, code) {
  let h = [];
  try { h = JSON.parse(localStorage.getItem('posumkm_keys') || '[]'); } catch {}
  h.unshift({ dev, code, t: new Date().toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) });
  h = h.slice(0, 10);
  localStorage.setItem('posumkm_keys', JSON.stringify(h));
  renderHistory(h);
}

function renderHistory(h) {
  if (!h || !h.length) return;
  document.getElementById('histWrap').style.display = 'block';
  document.getElementById('hist').innerHTML = h.map(x =>
    `<div class="hist-item"><span>${x.dev} • ${x.t}</span><b>${x.code}</b></div>`).join('');
}
try { renderHistory(JSON.parse(localStorage.getItem('posumkm_keys') || '[]')); } catch {}

document.getElementById('dev').addEventListener('keydown', e => { if (e.key === 'Enter') gen(); });
</script>
</body>
</html>
